name = "lc-lie-groups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LocallyConvexLieGroups"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "lc-manifolds"
git = "https://github.com/glaroton/lc-manifolds"
rev = "main"

[[lean_lib]]
name = "LocallyConvexLieGroups"
